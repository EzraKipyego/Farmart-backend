services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-farmart_db}
      POSTGRES_USER: ${DB_USER:-farmart_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-farmart_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DATABASE_URL: postgres://${DB_USER:-farmart_user}:${DB_PASSWORD:-farmart_pass}@db:5432/${DB_NAME:-farmart_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: